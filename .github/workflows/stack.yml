# What CI can prove about a repository that holds a stack and no source.
#
# `check` runs on every push: the command a self-hoster types first must work, and the compose
# file must still parse with the env files that command writes. That is genuinely most of what
# goes wrong here — a variable renamed in one file and not the other.
#
# `boot` starts the whole thing against the published image, and is manual because it cannot be
# anything else: ghcr.io/autobricks-ai/arlo-ai is a package of a private repository, so a run
# needs either that package made public or a read:packages token in GHCR_TOKEN. Until one of
# those is true it would fail on every push for a reason that has nothing to do with the change.
name: stack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bootstrap.sh is valid POSIX sh
        run: sh -n bootstrap.sh

      - name: It writes three env files, mode 600
        run: |
          ./bootstrap.sh https://arlo.example.com ci@example.com
          for f in .env db.env auth.env; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            test "$(stat -c '%a' "$f")" = 600 || { echo "$f is not 0600"; exit 1; }
          done

      - name: It refuses to reroll secrets over an existing install
        run: |
          if ./bootstrap.sh https://arlo.example.com ci@example.com; then
            echo 'bootstrap.sh overwrote existing env files — that orphans the database volume'
            exit 1
          fi

      # The env files exist now, so this resolves for real rather than against defaults.
      - name: compose.yml parses
        run: docker compose config -q

      - name: No secret is interpolated from the environment
        # Compose resolves ${...} against the invoking shell before the .env file, so a secret
        # referenced that way is a secret a polluted shell can replace. Only the image may be.
        # `[^#]*` before the match keeps this off the comment lines that *discuss* ${...},
        # of which this file has several — the prose explaining why they are not used.
        run: |
          if grep -nP '^\s*[^#]*\$\{(?!ARLO_IMAGE)' compose.yml; then
            echo 'the only ${...} allowed in compose.yml is ARLO_IMAGE'
            exit 1
          fi

  boot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to GHCR
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - run: ./bootstrap.sh http://127.0.0.1:9005 ci@example.com

      - name: Up
        # --wait holds until every healthcheck passes. The first boot applies every migration
        # to an empty database before the app serves, which is why the timeout is generous.
        run: docker compose up -d --wait --wait-timeout 600

      - name: It answers, and the schema is there
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 http://127.0.0.1:9005/)
          echo "GET / -> $code"; [ "$code" -lt 500 ]
          docker compose exec -T db psql -U postgres -d postgres -At \
            -c "select count(*) from arlo.schema_migrations" | tee /tmp/count
          [ "$(cat /tmp/count)" -gt 0 ]

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
